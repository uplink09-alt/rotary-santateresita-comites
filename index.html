<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comités — Rotary Club Santa Teresita</title>
<style>
  :root{
    --azul: #17458F;
    --azul-oscuro: #0E2C5C;
    --oro: #F7A81B;
    --fondo: #F7F8FA;
    --texto: #1B2430;
    --texto-suave: #5B677A;
    --borde: #E2E6EC;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--fondo);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--texto);
    padding: 24px 16px 60px;
  }

  .header{
    max-width: 640px;
    margin: 0 auto 24px;
    text-align: center;
  }

  .header .logo{
    max-width: 220px;
    width: 60%;
    height: auto;
    margin-bottom: 10px;
  }

  .header .eyebrow{
    display:inline-block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--azul);
    font-weight: 700;
    background: #EAF0FB;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .header h1{
    font-size: 24px;
    margin: 0 0 6px;
    color: var(--azul-oscuro);
  }

  .header p{
    font-size: 14px;
    color: var(--texto-suave);
    margin: 0;
    line-height: 1.5;
  }

  /* ---------- Vista mosaico ---------- */

  .mosaico{
    max-width: 640px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .baldosa{
    background: white;
    border: 1px solid var(--borde);
    border-top: 4px solid var(--color-comite, var(--oro));
    border-radius: 14px;
    padding: 10px 14px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    aspect-ratio: 2.4 / 1;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .baldosa:hover{
    box-shadow: 0 6px 16px rgba(23,69,143,0.12);
    transform: translateY(-2px);
  }

  .baldosa:active{
    transform: translateY(0);
  }

  .baldosa:focus-visible{
    outline: 2px solid var(--color-comite, var(--azul));
    outline-offset: 2px;
  }

  .baldosa .marca{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-comite, var(--oro));
  }

  .baldosa .nombre{
    font-size: 22px;
    font-weight: 700;
    color: var(--texto);
    line-height: 1.2;
  }

  .baldosa .responsable{
    font-size: 15px;
    font-weight: 700;
    color: var(--texto-suave);
    line-height: 1.3;
  }

  /* ---------- Vista detalle ---------- */

  .detalle-pantalla{
    max-width: 640px;
    margin: 0 auto;
    display: none;
  }

  .detalle-pantalla.activo{
    display: block;
  }

  .mosaico.oculto{
    display: none;
  }

  .volver{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--azul);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 12px;
  }

  .volver:focus-visible{
    outline: 2px solid var(--azul);
    outline-offset: 2px;
  }

  .tarjeta-detalle{
    background: white;
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 24px 20px;
  }

  .tarjeta-detalle .titulo{
    font-size: 20px;
    font-weight: 700;
    color: var(--color-comite, var(--azul-oscuro));
    margin: 0 0 4px;
  }

  .tarjeta-detalle .cargo-linea{
    font-size: 14px;
    color: var(--texto-suave);
    margin: 0 0 18px;
  }

  .tarjeta-detalle .descripcion{
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 18px;
  }

  .subtitulo{
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--texto-suave);
    font-weight: 700;
    margin: 0 0 8px;
  }

  .responsabilidades{
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .responsabilidades li{
    display: flex;
    gap: 10px;
    font-size: 14px;
    line-height: 1.5;
  }

  .responsabilidades li::before{
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-comite, var(--oro));
    margin-top: 7px;
    flex-shrink: 0;
  }

  .llamar{
    display: block;
    text-align: center;
    background: var(--color-comite, var(--azul));
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 13px;
    border-radius: 10px;
  }

  .llamar:active{
    filter: brightness(0.88);
  }

  /* ---------- Pie de página ---------- */

  .pie{
    max-width: 640px;
    margin: 36px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--borde);
    text-align: center;
  }

  .pie .club{
    font-size: 14px;
    font-weight: 700;
    color: var(--azul-oscuro);
    margin: 0 0 4px;
  }

  .pie .direccion{
    font-size: 13px;
    color: var(--texto-suave);
    margin: 0 0 14px;
  }

  .pie .contacto{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    margin-bottom: 16px;
  }

  .pie .contacto a{
    font-size: 13px;
    font-weight: 600;
    color: var(--azul);
    text-decoration: none;
  }

  .pie .contacto a:hover{
    text-decoration: underline;
  }

  .pie .redes{
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .pie .redes a{
    font-size: 13px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 20px;
  }

  .pie .redes a.instagram{
    background: linear-gradient(45deg, #F58529, #DD2A7B, #8134AF, #515BD4);
  }

  .pie .redes a.facebook{
    background: #1877F2;
  }

  @media (prefers-reduced-motion: reduce){
    .baldosa{ transition: none; }
  }
</style>
</head>

        "[Completar] Identificar necesidades de la comunidad",
        "[Completar] Planificar y ejecutar proyectos de servicio",
        "[Completar] Evaluar el impacto de los proyectos realizados"
      ]
    },
    {
      nombre: "Comité de Crisis",
      responsable: "Rodrigo Mellera",
      cargo: "Presidente de comité",
      telefono: "+542246xxxxxx",
      telefonoVisible: "xxx-xxxxxx",
      color: "#C1272D",
      descripcion: "[Completar] Coordina la respuesta del club ante situaciones de emergencia o crisis en la comunidad.",
      responsabilidades: [
        "[Completar] Activar protocolos ante situaciones de emergencia",
        "[Completar] Coordinar ayuda con otras instituciones locales",
        "[Completar] Centralizar la comunicación durante una crisis"
      ]
    },
    {
      nombre: "Comité Medio Ambiente",
      responsable: "Mariano Boccazzi",
      cargo: "Presidente de comité",
      telefono: "+542246xxxxxx",
      telefonoVisible: "xxx-xxxxxx",
      color: "#1E7F7A",
      descripcion: "[Completar] Impulsa proyectos y campañas de cuidado ambiental en Santa Teresita.",
      responsabilidades: [
        "[Completar] Organizar campañas de concientización ambiental",
        "[Completar] Coordinar jornadas de limpieza y reforestación",
        "[Completar] Articular con organismos ambientales locales"
      ]
    },
    {
      nombre: "Rueda Interna",
      responsable: "Natalia Molina",
      cargo: "Coordinadora",
      telefono: "+542246xxxxxx",
      telefonoVisible: "xxx-xxxxxx",
      color: "#4B5566",
      descripcion: "[Completar] Organiza espacios de formación y encuentro interno entre los socios del club.",
      responsabilidades: [
        "[Completar] Planificar charlas y encuentros internos",
        "[Completar] Fomentar el intercambio entre socios",
        "[Completar] Coordinar temario de reuniones formativas"
      ]
    }
  ];

  const mosaico = document.getElementById('mosaico');
  const pantallaDetalle = document.getElementById('pantallaDetalle');
  const tarjetaDetalle = document.getElementById('tarjetaDetalle');
  const btnVolver = document.getElementById('btnVolver');

  comites.forEach((c, i) => {
    const baldosa = document.createElement('button');
    baldosa.className = 'baldosa';
    baldosa.style.setProperty('--color-comite', c.color);
    baldosa.innerHTML = `
      <span class="marca"></span>
      <span class="nombre">${c.nombre}</span>
      <span class="responsable">${c.responsable}</span>
    `;
    baldosa.addEventListener('click', () => mostrarDetalle(i));
    mosaico.appendChild(baldosa);
  });

  function mostrarDetalle(i){
    const c = comites[i];
    const responsabilidadesHTML = (c.responsabilidades || [])
      .map(r => `<li>${r}</li>`)
      .join('');

    tarjetaDetalle.style.setProperty('--color-comite', c.color);
    tarjetaDetalle.innerHTML = `
      <h2 class="titulo">${c.nombre}</h2>
      <p class="cargo-linea">${c.cargo} · ${c.responsable}</p>
      <p class="descripcion">${c.descripcion}</p>
      <div class="subtitulo">Se encarga de</div>
      <ul class="responsabilidades">${responsabilidadesHTML}</ul>
      <a class="llamar" href="tel:${c.telefono}">Llamar · ${c.telefonoVisible}</a>
    `;

    mosaico.classList.add('oculto');
    pantallaDetalle.classList.add('activo');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  btnVolver.addEventListener('click', () => {
    pantallaDetalle.classList.remove('activo');
    mosaico.classList.remove('oculto');
  });
</script>
